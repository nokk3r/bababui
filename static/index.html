<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bababui</title>
  <link rel="icon" href="/static/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="manifest" href="/static/icons/site.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="login" class="gate" hidden>
    <form id="login-form" class="panel gate-card">
      <p class="eyebrow">bababui</p>
      <h1 data-i18n="login.title"></h1>
      <label for="password" data-i18n="login.password"></label>
      <input id="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="form-error" hidden></p>
      <button type="submit" class="primary" data-i18n="login.submit"></button>
      <select class="lang-select" data-lang-select data-i18n-label="settings.general.language"></select>
    </form>
  </div>

  <div id="shell" class="shell">
    <aside class="nav">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <strong>bababui</strong>
          <p data-i18n="app.tagline"></p>
        </div>
      </div>
      <nav>
        <button type="button" data-view="overview" class="active" data-i18n="nav.overview"></button>
        <button type="button" data-view="subscription" data-i18n="nav.subscription"></button>
        <button type="button" data-view="history" data-i18n="nav.history"></button>
        <button type="button" data-view="settings" data-i18n="nav.settings"></button>
      </nav>
      <div class="nav-foot">
        <p class="next-label" data-i18n="nav.nextCheck"></p>
        <p id="stat-next" class="next-run">—</p>
        <p id="versions" class="versions"></p>
      </div>
    </aside>

    <div class="workspace">
      <header class="top">
        <div>
          <h1 id="page-title"></h1>
        </div>
        <div class="top-actions">
          <button type="button" id="run-button" class="primary" data-i18n="action.checkNow"></button>
          <button type="button" id="stop-button" class="danger" hidden data-i18n="action.stop"></button>
        </div>
      </header>

      <div id="banner" class="banner" hidden></div>
      <div id="progress" class="progress" hidden>
        <div class="progress-meta">
          <span id="progress-label" data-i18n="progress.check"></span>
          <span id="progress-count"></span>
        </div>
        <div class="progress-track"><div id="progress-bar"></div></div>
      </div>

      <section id="view-overview">
        <div class="cards">
          <article class="card">
            <p data-i18n="stat.inSubscription"></p>
            <strong id="stat-nodes">—</strong>
          </article>
          <article class="card">
            <p data-i18n="stat.avgLatency"></p>
            <strong id="stat-latency">—</strong>
          </article>
          <article class="card">
            <p data-i18n="stat.avgDownload"></p>
            <strong id="stat-down-avg">—</strong>
          </article>
          <article class="card">
            <p data-i18n="stat.avgUpload"></p>
            <strong id="stat-up-avg">—</strong>
          </article>
        </div>

        <div class="toolbar">
          <input id="search" type="search" data-i18n-placeholder="search.placeholder" data-i18n-label="search.node">
          <select id="protocol-filter" data-i18n-label="filter.protocol"></select>
        </div>

        <div class="table-frame">
          <button type="button" id="column-picker" class="column-picker" data-i18n-label="columns.label" aria-expanded="false" aria-controls="column-menu">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.22-1.13.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.4.31.6.22l2.39-.96c.5.4 1.05.72 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.58-.22 1.13-.54 1.63-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
            </svg>
          </button>
          <div id="column-menu" class="column-menu" hidden>
            <label><input type="checkbox" value="protocol" checked> <span data-i18n="column.protocol"></span></label>
            <label><input type="checkbox" value="latency_ms" checked> <span data-i18n="column.latency"></span></label>
            <label><input type="checkbox" value="download_bps" checked> <span data-i18n="column.download"></span></label>
            <label><input type="checkbox" value="upload_bps" checked> <span data-i18n="column.upload"></span></label>
            <label><input type="checkbox" value="avg_latency_ms" checked> <span data-i18n="column.avgLatency"></span></label>
            <label><input type="checkbox" value="avg_download_bps" checked> <span data-i18n="column.avgDownload"></span></label>
            <label><input type="checkbox" value="avg_upload_bps" checked> <span data-i18n="column.avgUpload"></span></label>
            <label><input type="checkbox" value="spark" checked> <span data-i18n="column.spark"></span></label>
            <label><input type="checkbox" value="action" checked> <span data-i18n="column.action"></span></label>
          </div>
          <div class="table-wrap">
          <table id="nodes">
            <thead>
              <tr>
                <th data-sort="name" data-col="name" data-i18n="column.node"></th>
                <th data-sort="protocol" data-col="protocol" data-i18n="column.protocol"></th>
                <th data-sort="latency_ms" data-col="latency_ms" data-i18n="column.latency"></th>
                <th data-sort="download_bps" data-col="download_bps" data-i18n="column.download"></th>
                <th data-sort="upload_bps" data-col="upload_bps" data-i18n="column.upload"></th>
                <th data-sort="avg_latency_ms" data-col="avg_latency_ms" data-i18n="column.avgLatency"></th>
                <th data-sort="avg_download_bps" data-col="avg_download_bps" data-i18n="column.avgDownload"></th>
                <th data-sort="avg_upload_bps" data-col="avg_upload_bps" data-i18n="column.avgUpload"></th>
                <th data-col="spark" data-i18n="column.spark"></th>
                <th data-col="action"></th>
              </tr>
            </thead>
            <tbody><tr><td colspan="10" class="empty" data-i18n="common.loading"></td></tr></tbody>
          </table>
          </div>
        </div>
      </section>

      <section id="view-subscription" hidden>
        <div class="section-head">
          <p class="muted" data-i18n="subscription.lead"></p>
          <div class="top-actions">
            <button type="button" id="refresh-button" class="ghost" data-i18n="action.refreshSubscription"></button>
          </div>
        </div>
        <div class="toolbar">
          <input id="sub-search" type="search" data-i18n-placeholder="search.placeholder" data-i18n-label="search.subscription">
          <label class="check"><input id="show-inactive" type="checkbox"> <span data-i18n="subscription.showInactive"></span></label>
          <div class="toolbar-end">
            <button type="button" id="enable-all" class="ghost" data-i18n="action.enableAll"></button>
            <button type="button" id="disable-all" class="ghost" data-i18n="action.disableAll"></button>
          </div>
        </div>
        <div class="table-wrap">
          <table id="subscription-nodes">
            <thead>
              <tr>
                <th data-i18n="column.node"></th>
                <th data-i18n="column.protocol"></th>
                <th data-i18n="column.inCheck"></th>
              </tr>
            </thead>
            <tbody><tr><td colspan="3" class="empty" data-i18n="common.loading"></td></tr></tbody>
          </table>
        </div>
      </section>

      <section id="view-history" hidden>
        <div class="section-head">
          <div>
            <p class="muted" data-i18n="history.lead"></p>
          </div>
          <div class="top-actions">
            <button type="button" id="export-button" class="ghost" data-i18n="action.downloadCsv"></button>
            <button type="button" id="clear-button" class="danger" data-i18n="action.clearHistory"></button>
          </div>
        </div>
        <div id="runs" class="runs"></div>
      </section>

      <section id="view-settings" hidden>
        <form id="settings-form" class="settings">
          <nav class="settings-nav" data-i18n-label="settings.sections">
            <button type="button" data-settings-nav="general" class="active" data-i18n="settings.general.title"></button>
            <button type="button" data-settings-nav="subscription" data-i18n="settings.subscription.title"></button>
            <button type="button" data-settings-nav="schedule" data-i18n="settings.schedule.title"></button>
            <button type="button" data-settings-nav="check" data-i18n="settings.check.title"></button>
          </nav>

          <div class="settings-main">
            <section class="settings-pane" data-settings-pane="general">
              <h2 data-i18n="settings.general.title"></h2>
              <p class="settings-lead" data-i18n="settings.general.lead"></p>
              <label for="language" data-i18n="settings.general.language"></label>
              <select id="language" class="lang-select" data-lang-select></select>
            </section>

            <section class="settings-pane" data-settings-pane="subscription" hidden>
              <h2 data-i18n="settings.subscription.title"></h2>
              <p class="settings-lead" data-i18n="settings.subscription.lead"></p>
              <label for="subscription_url" data-i18n="settings.subscription.links"></label>
              <textarea id="subscription_url" rows="5" spellcheck="false"></textarea>
              <label class="check"><input id="subscription_insecure" type="checkbox"> <span data-i18n="settings.subscription.insecure"></span></label>
              <label class="check"><input id="refresh_before_run" type="checkbox"> <span data-i18n="settings.subscription.refreshBeforeRun"></span></label>
              <label class="check"><input id="tls_insecure_if_no_sni" type="checkbox"> <span data-i18n="settings.subscription.insecureNoSni"></span></label>
              <button type="submit" class="primary" data-i18n="action.save"></button>
            </section>

            <section class="settings-pane group" data-settings-pane="schedule" data-gate="scheduler_enabled" hidden>
              <h2 data-i18n="settings.schedule.title"></h2>
              <p class="settings-lead" data-i18n="settings.schedule.lead"></p>
              <label><span data-i18n="settings.schedule.interval"></span><input id="interval_minutes" type="number" min="1" max="1440" step="1"></label>
              <div class="field">
                <span class="label-row">
                  <label for="concurrency" data-i18n="settings.schedule.concurrency"></label>
                  <span class="hint" tabindex="0">
                    <span class="hint-mark" aria-hidden="true">?</span>
                    <span class="hint-bubble" role="tooltip" data-i18n="settings.schedule.concurrencyHint"></span>
                  </span>
                </span>
                <input id="concurrency" type="number" min="1" max="4" step="1">
              </div>
              <label><span data-i18n="settings.schedule.retention"></span><input id="retention_days" type="number" min="1" max="3650" step="1"></label>
              <label class="check"><input id="scheduler_enabled" type="checkbox"> <span data-i18n="settings.schedule.enabled"></span></label>
              <p class="estimate"></p>
              <button type="submit" class="primary" data-i18n="action.save"></button>
            </section>

            <section class="settings-pane" data-settings-pane="check" hidden>
              <h2 data-i18n="settings.check.title"></h2>
              <p class="settings-lead" data-i18n="settings.check.lead"></p>
              <div class="group">
                <h3 data-i18n="settings.check.whatToMeasure"></h3>
                <p class="card-note" data-i18n="settings.check.note"></p>
                <label class="check"><input id="measure_download" type="checkbox"> <span data-i18n="settings.check.measureDownload"></span></label>
                <label class="check"><input id="measure_upload" type="checkbox"> <span data-i18n="settings.check.measureUpload"></span></label>
              </div>
              <p class="estimate"></p>
              <button type="submit" class="primary" data-i18n="action.save"></button>
            </section>
          </div>
        </form>
      </section>

      <footer id="footnote" class="footnote" hidden>
        <span id="refreshed"></span>
        <span id="quota"></span>
      </footer>
    </div>
  </div>

  <dialog id="node-dialog"></dialog>
  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
