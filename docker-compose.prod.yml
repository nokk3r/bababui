services:
  bababui:
    image: nokk3r/bababui:0.5.0
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      WEB_PASSWORD: ${WEB_PASSWORD:?Задайте WEB_PASSWORD}
      LOG_LEVEL: WARNING
    volumes:
      - bababui-data:/data

volumes:
  bababui-data:
