name: bababui

services:
  bababui:
    build: .
    image: bababui:local
    container_name: bababui
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      WEB_PASSWORD: ${WEB_PASSWORD:-}
    volumes:
      - bababui-data:/data

volumes:
  bababui-data:
